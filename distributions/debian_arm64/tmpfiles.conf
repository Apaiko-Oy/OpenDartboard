# #1801: shipped as /usr/lib/tmpfiles.d/opendartboard.conf by `make deb`.
#
# opendartboard.service writes one log file per start (templates/opendartboard.service.template
# says why), so a board left on for a year would otherwise fill its card. systemd-tmpfiles-clean
# runs this daily: a file in logs/ last written, read or changed more than seven days ago goes.
#
# logs/current/ is excluded. It holds the newest file -- the running start's, or the last
# start's on a board that has not come up since -- and that file is never pruned: on a board
# that has been quiet for a week it is still the one being written, and the unit moves it up
# into logs/ at the next start, where its age then counts.
#
# `e` and not `d`: the unit makes the directory; this only ages what is in it, and the
# directory itself is never removed. An operator who wants another age writes
# /etc/tmpfiles.d/opendartboard.conf, which replaces this file whole.
e /var/lib/opendartboard/logs - - - 7d
x /var/lib/opendartboard/logs/current
